[project]
name = "legacy-reverse-engineering-platform"
version = "0.0.0"
description = "Multi-agent platform that reverse-engineers legacy Node/Express apps into evidence-linked documentation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ERA", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["services", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["requires_db: needs the Postgres from DATABASE_URL (REQUIRE_DB=1 makes absence a failure)"]
