[project]
name = "strata"
version = "0.1.0"
description = "Evidence-linked reverse engineering for legacy applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-pyyaml>=6",
    "detect-secrets>=1.5,<2",
    "pre-commit>=4,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"services/api/alembic/versions/*.py" = ["E501"]
"fixtures/answer-key/check_key.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "scripts", "tests", "fixtures/answer-key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
